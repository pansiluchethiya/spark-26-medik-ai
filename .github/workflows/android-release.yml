# Medik TWA (PWABuilder-style) — built ENTIRELY on the runner, no cloud.
# Trigger: push a tag like `mobile-v1.0.0`, or manual dispatch.
# Result: signed APK (+ AAB) attached to the GitHub Release for that tag.
#
# REQUIRED repo secrets (Settings → Secrets → Actions):
#   TWA_KEYSTORE_BASE64 — base64 of the release keystore:
#       base64 -i ~/.config/medik-twa/medik-twa.jks | pbcopy   (then paste)
#   TWA_STORE_PASSWORD  — keystore password
#   TWA_KEY_ALIAS       — key alias (medik-twa)
#   TWA_KEY_PASSWORD    — key password
# The signing identity MUST stay stable across releases (same key as the
# fingerprint in public/.well-known/assetlinks.json) or Android + asset
# links verification break. Never rotate without updating assetlinks.
#
# How it works: Bubblewrap regenerates the Android project from
# twa/twa-manifest.json (`update`), compiles it with Gradle using the
# runner's JDK 17 + Android SDK, and signs with the decoded keystore.

name: Android TWA release (PWABuilder-style)

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: android-actions/setup-android is broken with current
      # cmdline-tools (it requests the removed `tools` package), so the
      # SDK is installed manually instead.
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm cmdtools.zip
          # Bubblewrap validates the SDK by the presence of a top-level
          # `tools/` or `bin/` dir (legacy layout) — link the real binaries.
          mkdir -p "$ANDROID_HOME/bin"
          for f in "$ANDROID_HOME"/cmdline-tools/latest/bin/*; do ln -sf "$f" "$ANDROID_HOME/bin/"; done
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          } >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null || true
          # Bubblewrap validates the SDK by presence of these packages.
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      # Bubblewrap reads ~/.bubblewrap/config.json. Writing it directly
      # avoids the interactive first-run wizard entirely.
      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
          echo
          test -d "$JAVA_HOME/bin" && test -d "$ANDROID_SDK_ROOT/cmdline-tools" && echo "paths ok"

      - name: Restore release keystore
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
        run: |
          echo "$TWA_KEYSTORE_BASE64" | base64 -d > twa/medik-twa.jks
          chmod 600 twa/medik-twa.jks

      - name: Stamp version from tag
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#mobile-v}"
          python3 - "$TAG" "$VER" "${{ github.run_number }}" <<'EOF'
          import json, sys
          _, tag, ver, run_number = sys.argv
          p = 'twa/twa-manifest.json'
          m = json.load(open(p))
          m['appVersionName'] = ver
          m['appVersionCode'] = int(run_number)
          json.dump(m, open(p, 'w'), indent=2)
          print('version:', ver, 'code:', run_number)
          EOF

      - name: Generate Android project
        run: npx -y @bubblewrap/cli update --manifest ./twa/twa-manifest.json --skipVersionUpgrade

      - name: Build signed APK + AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_STORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          npx -y @bubblewrap/cli build --manifest ./twa/twa-manifest.json \
            --signingKeyPath ./twa/medik-twa.jks \
            --signingKeyAlias "${{ secrets.TWA_KEY_ALIAS }}"
          # Artifacts land in the step's working directory (mobile/).
          ls -l app-release-signed.apk app-release-bundle.aab

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          cp app-release-signed.apk "Medik-$TAG.apk"
          cp app-release-bundle.aab "Medik-$TAG.aab"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Medik $TAG" --notes "Trusted Web Activity release (PWABuilder-style, release-signed)."
          gh release upload "$TAG" "Medik-$TAG.apk" "Medik-$TAG.aab" --clobber
