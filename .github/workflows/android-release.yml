# Medik TWA (PWABuilder-style) — built ENTIRELY on the runner, no cloud.
# Trigger: push a tag like `mobile-v1.0.0`, or manual dispatch.
# Result: signed APK (+ AAB) attached to the GitHub Release for that tag.
#
# REQUIRED repo secrets (Settings → Secrets → Actions):
#   TWA_KEYSTORE_BASE64 — base64 of the release keystore:
#       base64 -i ~/.config/medik-twa/medik-twa.jks | pbcopy   (then paste)
#   TWA_STORE_PASSWORD  — keystore password
#   TWA_KEY_ALIAS       — key alias (medik-twa)
#   TWA_KEY_PASSWORD    — key password
# The signing identity MUST stay stable across releases (same key as the
# fingerprint in public/.well-known/assetlinks.json) or Android + asset
# links verification break. Never rotate without updating assetlinks.
#
# How it works: Bubblewrap regenerates the Android project from
# twa/twa-manifest.json (`update`), compiles it with Gradle using the
# runner's JDK 17 + Android SDK, and signs with the decoded keystore.

name: Android TWA release (PWABuilder-style)

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Point Bubblewrap at JDK + SDK
        run: |
          npx -y @bubblewrap/cli updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_SDK_ROOT"

      - name: Restore release keystore
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
        run: |
          echo "$TWA_KEYSTORE_BASE64" | base64 -d > twa/medik-twa.jks
          chmod 600 twa/medik-twa.jks

      - name: Stamp version from tag
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#mobile-v}"
          python3 - "$TAG" "$VER" "${{ github.run_number }}" <<'EOF'
          import json, sys
          _, ver, run_number = sys.argv
          p = 'twa/twa-manifest.json'
          m = json.load(open(p))
          m['appVersionName'] = ver
          m['appVersionCode'] = int(run_number)
          json.dump(m, open(p, 'w'), indent=2)
          print('version:', ver, 'code:', run_number)
          EOF

      - name: Generate Android project
        run: npx -y @bubblewrap/cli update --manifest ./twa --skipVersionUpgrade

      - name: Build signed APK + AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_STORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          npx -y @bubblewrap/cli build --manifest ./twa \
            --signingKeyPath ./twa/medik-twa.jks \
            --signingKeyAlias "${{ secrets.TWA_KEY_ALIAS }}"
          ls -l twa/app-release-signed.apk twa/app-release-bundle.aab

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          cp twa/app-release-signed.apk "Medik-$TAG.apk"
          cp twa/app-release-bundle.aab "Medik-$TAG.aab"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Medik $TAG" --notes "Trusted Web Activity release (PWABuilder-style, release-signed)."
          gh release upload "$TAG" "Medik-$TAG.apk" "Medik-$TAG.aab" --clobber
