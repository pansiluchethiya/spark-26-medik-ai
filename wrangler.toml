name = "medik-triage"
compatibility_date = "2024-11-14"
pages_build_output_dir = "dist"

# Cloudflare Pages — static frontend only. The AI backend now lives in
# backend/ (Node.js + Express on OCI 152.67.162.246); the frontend calls it
# via VITE_BACKEND_URL. Build settings are configured in the Pages dashboard:
# Build command: npm run build
# Output directory: dist

[vars]
# Environment variables (set in Cloudflare dashboard > Settings > Variables or via .env)
# GROQ_API_KEY = required for fast triage (Groq OSS 120B)
# GROQ_MODEL = openai/gpt-oss-120b (default)
# TAVILY_API_KEY = optional, improves web search quality (fallback: DuckDuckGo)
# GEMINI_API_KEY = optional fallback provider
